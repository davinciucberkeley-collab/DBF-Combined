# Regenerate the analysis and the review page from the committed sources, run the independent checks,
# and fail if any committed output no longer matches what the sources produce.
# SOLIDWORKS (CAD, drawings, FEA) and the aero solvers (XFOIL, AVL, SU2) cannot run on a hosted runner;
# their committed outputs are inputs here, and archive/c0/analysis/verify.py checks the sizing against them.
name: Regenerate and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sizing, BOM, vortex lattice, trade study
        run: |
          node archive/c0/analysis/sizing.mjs > /dev/null
          node archive/c0/analysis/export_bom.mjs
          node archive/c0/analysis/vlm.mjs > /dev/null
          node archive/c0/analysis/tradestudy.mjs > /dev/null

      - name: Independent checks (archive/c0/analysis/verify.py)
        run: python archive/c0/analysis/verify.py

      - name: Build the review page and companion documents
        run: node archive/c0/review/build.mjs

      - name: Committed outputs match the regenerated ones
        # line endings normalised: export_bom.mjs writes CRLF, the repository stores LF
        # review/*.html fragment copies are also written by the build but are git-ignored (DBF-Combined keeps the root copies only)
        run: |
          git -c core.autocrlf=input diff --stat --exit-code -- \
            archive/c0/analysis/results.json archive/c0/analysis/aero.json archive/c0/analysis/tradestudy.json archive/c0/docs/purchasing \
            archive/c0/VTOL-Review.html archive/c0/build-manual.html archive/c0/test-plan.html archive/c0/flight-software.html archive/c0/templates.html \
            || { echo "::error::A committed output is stale: run the pipeline locally (sizing -> export_bom -> vlm -> verify -> tradestudy -> review build) and commit the results."; exit 1; }

      - name: Flight parameter file against ArduPlane metadata (advisory)
        # downloads ArduPilot's current parameter list, which changes independently of this repo
        continue-on-error: true
        run: python archive/c0/firmware/tools/check_params.py archive/c0/firmware/vtol_c0.param
