<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Chain Explorer</title>
<meta name="description" content="Every requirement traced to its claims, calculations, parameters and sources. Data: build_graph.py → out/graph.js.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* tokens: redesign/design-system/tokens.css v1 (subset used here) */
:root {
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  --radius-xs: 3px; --radius-sm: 5px; --radius-md: 8px; --radius-lg: 12px;
  --dur-fast: 120ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #F6F7F9; --panel: #FFFFFF; --panel-2: #EEF1F5; --panel-3: #E2E6EC;
  --line: #E3E7ED; --line-2: #CBD2DB; --line-3: #9AA4B1;
  --fg: #121619; --fg-2: #4B5563; --fg-3: #6B7280;
  --accent: #1F5FC7; --accent-hover: #174DA6; --accent-wash: #E6EEFB; --accent-line: #A9C3EE; --on-accent: #FFFFFF;
  --st-unverified: #8A5600; --st-unverified-wash: #FBEFD6; --st-unverified-line: #E6C27A;
  --st-proposed:   #4B5563; --st-proposed-wash:   #EEF0F3; --st-proposed-line:   #C5CBD3;
  --st-checked:    #0E6F74; --st-checked-wash:    #DDF3F2; --st-checked-line:    #8FD1D0;
  --st-verified:   #1A6E3A; --st-verified-wash:   #DDF5E5; --st-verified-line:   #8FD4A8;
  --st-fail:       #B42323; --st-fail-wash:       #FBE4E4; --st-fail-line:       #EBA3A3;
  --shadow-pop: 0 12px 32px rgba(18, 22, 25, 0.14), 0 2px 6px rgba(18, 22, 25, 0.08);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1217; --panel: #161B22; --panel-2: #1D232C; --panel-3: #262D38;
    --line: #232A34; --line-2: #313A46; --line-3: #4B5563;
    --fg: #E6EAF0; --fg-2: #A7B0BD; --fg-3: #8891A0;
    --accent: #6EA8FE; --accent-hover: #8FBCFF; --accent-wash: #17273F; --accent-line: #2E4E80; --on-accent: #0F1217;
    --st-unverified: #F2C063; --st-unverified-wash: #3A2B0C; --st-unverified-line: #6B4F17;
    --st-proposed:   #B4BCC8; --st-proposed-wash:   #232A34; --st-proposed-line:   #3C4552;
    --st-checked:    #5CD0D4; --st-checked-wash:    #0F3537; --st-checked-line:    #1E6367;
    --st-verified:   #6ADB94; --st-verified-wash:   #10361F; --st-verified-line:   #1F6639;
    --st-fail:       #F58A8A; --st-fail-wash:       #43191B; --st-fail-line:       #7A3336;
    --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1217; --panel: #161B22; --panel-2: #1D232C; --panel-3: #262D38;
  --line: #232A34; --line-2: #313A46; --line-3: #4B5563;
  --fg: #E6EAF0; --fg-2: #A7B0BD; --fg-3: #8891A0;
  --accent: #6EA8FE; --accent-hover: #8FBCFF; --accent-wash: #17273F; --accent-line: #2E4E80; --on-accent: #0F1217;
  --st-unverified: #F2C063; --st-unverified-wash: #3A2B0C; --st-unverified-line: #6B4F17;
  --st-proposed:   #B4BCC8; --st-proposed-wash:   #232A34; --st-proposed-line:   #3C4552;
  --st-checked:    #5CD0D4; --st-checked-wash:    #0F3537; --st-checked-line:    #1E6367;
  --st-verified:   #6ADB94; --st-verified-wash:   #10361F; --st-verified-line:   #1F6639;
  --st-fail:       #F58A8A; --st-fail-wash:       #43191B; --st-fail-line:       #7A3336;
  --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
}
[data-status="UNVERIFIED"] { --st-c: var(--st-unverified); --st-w: var(--st-unverified-wash); --st-l: var(--st-unverified-line); }
[data-status="PROPOSED"]   { --st-c: var(--st-proposed);   --st-w: var(--st-proposed-wash);   --st-l: var(--st-proposed-line); }
[data-status="CHECKED"]    { --st-c: var(--st-checked);    --st-w: var(--st-checked-wash);    --st-l: var(--st-checked-line); }
[data-status="VERIFIED"]   { --st-c: var(--st-verified);   --st-w: var(--st-verified-wash);   --st-l: var(--st-verified-line); }
[data-status="FAIL"]       { --st-c: var(--st-fail);       --st-w: var(--st-fail-wash);       --st-l: var(--st-fail-line); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font-sans); overflow: hidden; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; accent-color: var(--accent); }
button, input { font: inherit; color: inherit; }
a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-xs); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-3); border: 3px solid var(--bg); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
[hidden] { display: none !important; }

/* ---- design-system components used here ---- */
.ds-badge { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: var(--radius-xs); font: 600 11px/1 var(--font-mono); letter-spacing: 0.04em; white-space: nowrap; color: var(--st-c); background: var(--st-w); box-shadow: inset 0 0 0 1px var(--st-l); }
.ds-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-c); }
.ds-seg { display: inline-flex; padding: 3px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); }
.ds-seg button { appearance: none; border: 0; background: none; padding: 5px 11px; border-radius: 3px; font: 500 13px/1 var(--font-sans); color: var(--fg-2); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.ds-seg button:hover { color: var(--fg); }
.ds-seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent-line); }
.ds-label { font-size: 11.5px; font-weight: 500; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; margin: 18px 0 8px; }
.ds-label:first-child { margin-top: 0; }
.mg { display: inline-block; min-width: 46px; text-align: right; font: 500 12px/18px var(--font-mono); color: var(--fg-2); padding: 0 6px; border-radius: var(--radius-xs); white-space: nowrap; }
.mg.neg { color: var(--st-fail); background: var(--st-fail-wash); box-shadow: inset 0 0 0 1px var(--st-fail-line); font-weight: 600; }
.mg.thin { color: var(--st-unverified); }
.btn { height: 30px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); color: var(--fg-2); cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { color: var(--fg); border-color: var(--accent-line); background: var(--accent-wash); }
.btn.primary { border-color: var(--accent-line); color: var(--fg); background: var(--accent-wash); }
.lnk { border: 0; background: none; padding: 0; color: var(--fg); cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.lnk:hover { color: var(--accent); }

/* ---- layout ---- */
.app { display: grid; grid-template-columns: 330px minmax(0, 1fr) 380px; grid-template-rows: 52px auto minmax(0, 1fr); height: 100vh; }
.app.wide { grid-template-columns: 0 minmax(0, 1fr) 360px; }
aside.left { grid-column: 1; grid-row: 3; } main { grid-column: 2; grid-row: 3; } aside.right { grid-column: 3; grid-row: 3; }
.app.wide aside.left { display: none; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-size: 15px; font-weight: 600; }
.brand span { color: var(--fg-3); font: 12px var(--font-mono); }
.search { position: relative; flex: 1; max-width: 480px; margin-left: 8px; }
.search input { width: 100%; height: 34px; padding: 0 34px 0 32px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--panel-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--panel); }
.search svg { position: absolute; left: 10px; top: 10px; color: var(--fg-3); }
.search kbd { position: absolute; right: 8px; top: 8px; font: 11px var(--font-mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.results { position: absolute; top: 38px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); overflow: hidden; z-index: 30; display: none; }
.results.open { display: block; }
.results button { display: grid; grid-template-columns: 84px minmax(0, auto) minmax(0, 1fr); width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: 0; background: none; text-align: left; cursor: pointer; }
.results button[aria-selected="true"], .results button:hover { background: var(--panel-2); }
.results .ty { font: 500 11px var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em; }
.results .rid { font: 12px var(--font-mono); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
.results .rt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .none { padding: 10px 12px; color: var(--fg-3); }
.spacer { flex: 1; }
.iconbtn { height: 30px; min-width: 30px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); cursor: pointer; color: var(--fg-2); padding: 0 8px; }
.iconbtn:hover { color: var(--fg); }

.statusline { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 16px; font-size: 13px; color: var(--fg-2); background: var(--panel); border-bottom: 1px solid var(--line); }
.statusline:empty { display: none; }
.statusline .sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st-unverified); margin-right: 2px; }
.statusline .sdot.ok { background: var(--st-verified); }
.statusline b { color: var(--fg); font-weight: 600; }
.statusline .meta { color: var(--fg-3); font: 12px var(--font-mono); margin-left: auto; }

aside { background: var(--panel); overflow-y: auto; min-height: 0; }
aside.left { border-right: 1px solid var(--line); padding: 14px 12px 40px; }
aside.right { border-left: 1px solid var(--line); padding: 18px 18px 48px; overflow-x: hidden; }
main { position: relative; min-width: 0; min-height: 0; background: var(--bg); display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---- requirement list ---- */
.lhead { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.lhead .ds-seg button { padding: 4px 8px; font-size: 12px; }
.grp h3 { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 500; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; margin: 16px 6px 6px; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: var(--radius-sm); background: none; text-align: left; cursor: pointer; }
.req:hover { background: var(--panel-2); }
.req[aria-current="true"] { border-color: var(--accent-line); background: var(--accent-wash); }
.req .rid { font: 11.5px var(--font-mono); color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req .rt { grid-column: 1; font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req .rm { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); }
.req .rm .f { color: var(--st-fail); font-weight: 600; }
.req .rm .mg { margin-left: auto; }
.req .ds-badge { grid-row: 1 / span 2; grid-column: 2; align-self: start; }

/* ---- home ---- */
.home { overflow-y: auto; padding: 24px 28px 48px; }
.home h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 4px; }
.home h2 { font-size: 15px; font-weight: 600; margin: 26px 0 8px; }
.home .sub { color: var(--fg-2); margin: 0 0 18px; max-width: 68ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 18px; max-width: 900px; }
.tile { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel); padding: 10px 12px; }
.tile b { display: block; font: 600 22px/1.2 var(--font-mono); }
.tile span { color: var(--fg-3); font-size: 12.5px; }
.tile.fail b { color: var(--st-fail); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); max-width: 900px; }
.bar i { display: block; height: 100%; background: var(--st-c); }
.legendrow { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-2); margin: 8px 0 0; }
.legendrow span { display: inline-flex; align-items: center; gap: 6px; }
.legendrow i { width: 9px; height: 9px; border-radius: 50%; background: var(--st-c); }
.scrollx { max-width: 900px; overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); }
table.list th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--fg-3); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
table.list td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.click { cursor: pointer; }
table.list tr.click:hover td { background: var(--panel-2); }
table.list td.num, table.list th.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
table.list .id { font: 11.5px var(--font-mono); color: var(--fg-3); display: block; }

/* ---- chain view ---- */
.chainbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 3px 5px; border-radius: var(--radius-xs); cursor: pointer; color: var(--fg-2); font: 12.5px var(--font-mono); }
.crumbs button.home { font-family: var(--font-sans); font-size: 13px; }
.crumbs button:hover { color: var(--fg); background: var(--panel-2); }
.crumbs .cur { color: var(--fg); font: 600 12.5px var(--font-mono); padding: 3px 5px; }
.crumbs .sep { color: var(--fg-3); }
.chainbar .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.chainbar .zoom { font: 12px var(--font-mono); color: var(--fg-3); min-width: 44px; text-align: center; }
.chainnote { padding: 6px 16px; font-size: 12.5px; color: var(--fg-2); background: var(--panel-2); border-bottom: 1px solid var(--line); }
.chainscroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
#chainSvg { display: block; }
#chainSvg text { font-family: var(--font-sans); }
#chainSvg .colh { font: 500 11px var(--font-sans); fill: var(--fg-3); letter-spacing: .04em; }
#chainSvg .e { fill: none; stroke: var(--line-3); stroke-width: 1.25; opacity: .75; }
#chainSvg .e.fail { stroke: var(--st-fail); opacity: .85; }
#chainSvg.hot .e { opacity: .1; }
#chainSvg.hot .e.on { opacity: 1; stroke: var(--accent); stroke-width: 2; }
#chainSvg.hot .n { opacity: .3; }
#chainSvg.hot .n.on { opacity: 1; }
#chainSvg .n { cursor: pointer; }
#chainSvg .box { fill: var(--st-w); stroke: var(--st-l); stroke-width: 1; }
#chainSvg .n[data-status="FAIL"] .box { stroke: var(--st-fail); stroke-width: 1.5; }
#chainSvg .n.ref .box { stroke-dasharray: 4 3; fill: var(--panel); }
#chainSvg .n:hover .box { stroke: var(--accent); }
#chainSvg .n.focus .box { stroke: var(--accent); stroke-width: 2; }
#chainSvg .selr { fill: none; stroke: var(--accent); stroke-width: 2; }
#chainSvg .glyph { fill: none; stroke: var(--fg-2); stroke-width: 1.4; }
#chainSvg .nid { font: 11px var(--font-mono); fill: var(--fg-3); }
#chainSvg .nst { font: 600 9.5px var(--font-mono); fill: var(--st-c); letter-spacing: .04em; }
#chainSvg .nt { font-size: 12.5px; font-weight: 500; fill: var(--fg); }
#chainSvg .nv { font: 500 12px var(--font-mono); fill: var(--fg); }
#chainSvg .nl { font: 11px var(--font-mono); fill: var(--fg-3); }
#chainSvg .mgb { fill: var(--panel); stroke: var(--line-2); }
#chainSvg .mgt { font: 600 11px var(--font-mono); fill: var(--fg-2); }
#chainSvg .mg-neg .mgb { fill: var(--st-fail-wash); stroke: var(--st-fail); }
#chainSvg .mg-neg .mgt { fill: var(--st-fail); }
#chainSvg .mg-thin .mgt { fill: var(--st-unverified); }

/* ---- overview ---- */
.ovwrap { flex: 1; position: relative; min-height: 0; }
#graph { position: absolute; inset: 0; }
.ovtools { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 5; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 8px 10px; font-size: 12px; display: grid; gap: 3px; }
.legend div { display: flex; align-items: center; gap: 7px; color: var(--fg-2); }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--st-c); }
.hint { position: absolute; right: 12px; bottom: 12px; color: var(--fg-3); font-size: 12px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2); font-size: 13px; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 13px; color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-c, var(--fg-3)); flex: none; }
.chip .n { color: var(--fg-3); font: 11.5px var(--font-mono); }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent-line); }
.chip[aria-pressed="false"] { color: var(--fg-3); }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
.note { color: var(--fg-3); font-size: 12.5px; margin: 8px 0 0; }

/* ---- detail panel ---- */
.empty { color: var(--fg-2); }
.empty ol { padding-left: 18px; } .empty li { margin: 6px 0; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tylab { font: 500 11px var(--font-mono); color: var(--fg-3); letter-spacing: .04em; text-transform: uppercase; }
.dtitle { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 10px 0 2px; }
.did { font: 12px var(--font-mono); color: var(--fg-3); word-break: break-all; }
.text { margin: 10px 0; color: var(--fg-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.big { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
.big b { font: 600 22px var(--font-mono); letter-spacing: -0.01em; }
.big span { color: var(--fg-3); }
.gauge { position: relative; height: 8px; border-radius: 4px; background: var(--panel-2); margin: 8px 0 4px; overflow: hidden; }
.gauge i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
.gauge u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); }
.reasons { margin: 12px 0; padding: 8px 10px; border: 1px solid var(--st-unverified-line); background: var(--st-unverified-wash); border-radius: var(--radius-sm); }
.reasons.fail { border-color: var(--st-fail-line); background: var(--st-fail-wash); }
.reasons div { margin: 2px 0; font-size: 13px; }
h3.sec { font-size: 11.5px; font-weight: 500; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; margin: 20px 0 8px; }
.eq { font: 13px/1.5 var(--font-mono); background: var(--panel-2); padding: 9px 11px; border-radius: var(--radius-sm); white-space: pre-wrap; word-break: break-word; }
table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kv td, table.kv th { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
table.kv th { color: var(--fg-3); font-weight: 500; font-size: 11.5px; }
table.kv td.num { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
table.kv .nlink { word-break: break-all; }
dl.meta { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 13px; margin: 10px 0; }
dl.meta dt { color: var(--fg-3); } dl.meta dd { margin: 0; word-break: break-word; }
.nlink { border: 0; background: none; padding: 0; color: var(--fg); cursor: pointer; font: 12.5px var(--font-mono); text-align: left; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.nlink:hover { color: var(--accent); }
.partbtn { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px 6px 0; padding: 4px 9px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--panel); font: 12px var(--font-mono); color: var(--fg); text-decoration: none; }
.tree { list-style: none; padding-left: 0; margin: 6px 0; font-size: 13px; }
.tree ul { list-style: none; padding-left: 14px; margin: 2px 0 2px 5px; border-left: 1px solid var(--line); }
.tree li { margin: 3px 0; }
.row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 3px 0; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--st-c); display: inline-block; }
.tree .arg { font: 12px var(--font-mono); color: var(--fg-3); }
.v { color: var(--fg-3); font-family: var(--font-mono); font-size: 12px; }
.path { font-size: 12.5px; margin: 4px 0; line-height: 1.7; }
.path .sep { color: var(--fg-3); margin: 0 4px; }
.tbl { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
details.grp2 { border: 1px solid var(--line); border-radius: var(--radius-sm); margin: 6px 0; background: var(--panel); }
details.grp2 summary { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; cursor: pointer; font-size: 13px; }
details.grp2 summary span.s { flex: 1; min-width: 0; overflow-wrap: anywhere; }
details.grp2 summary .n { font: 600 12px var(--font-mono); color: var(--fg-2); white-space: nowrap; }
details.grp2 ul { margin: 0; padding: 4px 10px 8px 26px; font-size: 12.5px; color: var(--fg-2); }
details.grp2 li { margin: 3px 0; word-break: break-word; }

@media (max-width: 1180px) { .app { grid-template-columns: 290px minmax(0, 1fr) 330px; } .app.wide { grid-template-columns: 0 minmax(0, 1fr) 330px; } }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app, .app.wide { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto auto; height: auto; }
  header { flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
  .search { order: 5; flex-basis: 100%; max-width: none; margin: 0; }
  .brand span { display: none; }
  main { grid-column: 1; grid-row: 3; height: 70vh; }
  aside.right { grid-column: 1; grid-row: 4; border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
  aside.left { grid-column: 1; grid-row: 5; border-right: 0; border-top: 1px solid var(--line); padding: 16px; }
  .app.wide aside.left { display: none; }
  .home { padding: 18px 16px 32px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><b>Proof chains</b><span id="dataset">—</span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Search requirements, claims, parameters…" autocomplete="off" aria-label="Search ids and titles" aria-controls="results">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="spacer"></div>
    <div class="ds-seg" role="group" aria-label="View">
      <button data-view="reqs" aria-pressed="true">Requirements</button><button data-view="overview" aria-pressed="false" title="Whole graph (2-D canvas; 3-D on request)">Overview</button>
    </div>
    <button class="iconbtn" id="theme" title="Theme: auto / light / dark" aria-label="Theme">◐</button>
  </header>

  <div class="statusline" id="statusline" role="status"></div>

  <aside class="left" id="left">
    <div id="reqPane">
      <div class="lhead">
        <div class="ds-seg" role="group" aria-label="Show requirements">
          <button data-rfilter="all" aria-pressed="true">All</button><button data-rfilter="fails" aria-pressed="false">With fails</button><button data-rfilter="none" aria-pressed="false">No claims</button>
        </div>
      </div>
      <div id="reqList"></div>
    </div>
    <div id="ovPane" hidden>
      <div class="ds-label">Node types</div>
      <div class="chips" id="typeChips"></div>
      <p class="note">Parameters, assumptions and parts are off by default to keep the graph light. With them off, a source links straight to the calculations that use its numbers.</p>
      <div class="ds-label">Status</div>
      <div class="chips" id="statusChips"></div>
    </div>
  </aside>

  <main>
    <section class="pane" id="homePane"><div class="home" id="home"></div></section>
    <section class="pane" id="chainPane" hidden>
      <div class="chainbar">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs"></nav>
        <div class="tools">
          <button class="btn" id="inputsBtn"></button>
          <button class="iconbtn" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
          <span class="zoom" id="zoomLbl">100 %</span>
          <button class="iconbtn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
          <button class="btn" id="zoomFit" title="Fit the width of the chain in the window">Fit</button>
        </div>
      </div>
      <div class="chainnote" id="chainNote" hidden></div>
      <div class="chainscroll" id="chainScroll"><svg id="chainSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proof chain"></svg></div>
    </section>
    <section class="pane" id="ovMain" hidden>
      <div class="ovwrap">
        <div id="graph"></div>
        <div class="loading" id="ovLoading">Laying out the graph…</div>
        <div class="ovtools"><div class="ds-seg" role="group" aria-label="Renderer"><button data-mode="2d" aria-pressed="true">2D</button><button data-mode="3d" aria-pressed="false" title="Heavier: WebGL">3D</button></div></div>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint">drag to pan · scroll to zoom · click a dot</div>
      </div>
    </section>
  </main>

  <aside class="right" id="detail"></aside>
</div>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
