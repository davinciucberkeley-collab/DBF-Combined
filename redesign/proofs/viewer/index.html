<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Chain Explorer</title>
<meta name="description" content="Requirements, claims, calculations, parameters and sources as one explorable graph. Data: build_graph.py → out/graph.js.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='8' cy='24' r='4' fill='%23059669'/%3E%3Ccircle cx='16' cy='14' r='4' fill='%232563eb'/%3E%3Ccircle cx='24' cy='6' r='4' fill='%237c3aed'/%3E%3Cpath d='M8 24L16 14L24 6' stroke='%2364748b' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e2e5ea; --text: #16191d; --muted: #5d6570; --faint: #687180;
  --accent: #2563eb; --graph-bg: #f6f7f9; --link: rgba(60,70,85,0.28); --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --st-VERIFIED: #15803d; --st-CHECKED: #2563eb; --st-PROPOSED: #7b8491; --st-UNVERIFIED: #c27803; --fails: #d92d20;
  --ty-requirement: #7c3aed; --ty-claim: #2563eb; --ty-calculation: #0f8a7e; --ty-parameter: #b7791f; --ty-assumption: #e05d14;
  --ty-source: #059669; --ty-test: #db2777; --ty-part: #8792a2;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #151a21; --panel-2: #1b212a; --line: #29313c; --text: #e7eaee; --muted: #a2abb7; --faint: #8a95a5;
    --accent: #6ea2ff; --graph-bg: #0e1116; --link: rgba(190,200,215,0.22); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --st-VERIFIED: #3fcf7f; --st-CHECKED: #6ea2ff; --st-PROPOSED: #8e98a6; --st-UNVERIFIED: #f2b33d; --fails: #ff6b5e;
    --ty-requirement: #a78bfa; --ty-claim: #6ea2ff; --ty-calculation: #2dd4bf; --ty-parameter: #e3b341; --ty-assumption: #fb8c4a;
    --ty-source: #34d399; --ty-test: #f472b6; --ty-part: #8b97a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #151a21; --panel-2: #1b212a; --line: #29313c; --text: #e7eaee; --muted: #a2abb7; --faint: #8a95a5;
  --accent: #6ea2ff; --graph-bg: #0e1116; --link: rgba(190,200,215,0.22); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  --st-VERIFIED: #3fcf7f; --st-CHECKED: #6ea2ff; --st-PROPOSED: #8e98a6; --st-UNVERIFIED: #f2b33d; --fails: #ff6b5e;
  --ty-requirement: #a78bfa; --ty-claim: #6ea2ff; --ty-calculation: #2dd4bf; --ty-parameter: #e3b341; --ty-assumption: #fb8c4a;
  --ty-source: #34d399; --ty-test: #f472b6; --ty-part: #8b97a8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

/* ---- layout: top bar, left filters, graph, right details ---- */
.app { display: grid; grid-template-columns: 290px 1fr 380px; grid-template-rows: 52px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand span { color: var(--faint); font-size: 12px; }
.search { position: relative; flex: 1; max-width: 460px; margin-left: 8px; }
.search input { width: 100%; height: 34px; padding: 0 12px 0 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--panel); }
.search svg { position: absolute; left: 10px; top: 10px; color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 8px; font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.results { position: absolute; top: 38px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; display: none; }
.results.open { display: block; }
.results button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: 0; background: none; text-align: left; cursor: pointer; }
.results button[aria-selected="true"], .results button:hover { background: var(--panel-2); }
.results .rid { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.results .rt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.iconbtn { height: 32px; min-width: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; color: var(--muted); padding: 0 8px; }
.iconbtn:hover { color: var(--text); }

aside { background: var(--panel); overflow-y: auto; min-height: 0; }
aside.left { border-right: 1px solid var(--line); padding: 14px; }
aside.right { border-left: 1px solid var(--line); padding: 18px 18px 40px; overflow-x: hidden; }
table.kv .nlink { word-break: break-all; }
.banner { cursor: pointer; }
h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; font-weight: 600; }
h3:first-child { margin-top: 0; }

.summary { display: grid; gap: 6px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.bar i { display: block; height: 100%; }
.summary small { color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12.5px; color: var(--text); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.reset { font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; margin-left: 4px; text-decoration: underline; }

.list { display: grid; gap: 2px; margin: 0 -6px; }
.item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; border: 0; background: none; text-align: left; cursor: pointer; }
.item:hover, .item.sel { background: var(--panel-2); }
.item .dot { width: 8px; height: 8px; border-radius: 50%; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t small { display: block; color: var(--faint); font: 11px var(--mono); }
.item .m { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.item .m.neg { color: var(--fails); font-weight: 600; }

main { position: relative; min-width: 0; min-height: 0; background: var(--graph-bg); }
#graph { position: absolute; inset: 0; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, 10px); font-size: 11.5px; line-height: 1.2; padding: 1px 5px; border-radius: 4px; white-space: nowrap; color: var(--text);
       background: color-mix(in srgb, var(--graph-bg) 78%, transparent); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.lbl.req { font-weight: 600; }
.lbl.sel { box-shadow: 0 0 0 1.5px var(--accent); }
.legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: grid; gap: 3px; box-shadow: var(--shadow); }
.legend div { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hint { position: absolute; right: 12px; bottom: 12px; color: var(--faint); font-size: 12px; }
.banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(680px, calc(100% - 24px)); padding: 8px 12px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 5; }
.banner.err { background: color-mix(in srgb, var(--fails) 14%, var(--panel)); border: 1px solid var(--fails); }
.banner.info { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.banner:empty { display: none; }

/* ---- detail panel ---- */
.empty { color: var(--muted); }
.empty ol { padding-left: 18px; } .empty li { margin: 6px 0; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.solid { color: #fff; border-color: transparent; }
.dtitle { font-size: 19px; line-height: 1.25; margin: 10px 0 2px; letter-spacing: -0.01em; }
.did { font: 12px var(--mono); color: var(--muted); }
.text { margin: 10px 0; }
.big { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 6px; flex-wrap: wrap; }
.big b { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.big span { color: var(--muted); }
.gauge { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); margin: 8px 0 4px; overflow: hidden; }
.gauge i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; }
.gauge u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.reasons { margin: 12px 0; padding: 8px 10px 8px 12px; border-left: 3px solid var(--st-UNVERIFIED); background: color-mix(in srgb, var(--st-UNVERIFIED) 9%, var(--panel)); border-radius: 0 6px 6px 0; }
.reasons.fail { border-color: var(--fails); background: color-mix(in srgb, var(--fails) 9%, var(--panel)); }
.reasons div { margin: 2px 0; font-size: 13px; }
.eq { font: 13px/1.5 var(--mono); background: var(--panel-2); padding: 9px 11px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kv td, table.kv th { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
table.kv th { color: var(--faint); font-weight: 500; font-size: 11.5px; }
table.kv td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
dl.meta { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 13px; margin: 10px 0; }
dl.meta dt { color: var(--faint); } dl.meta dd { margin: 0; word-break: break-word; }
.nlink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: 12.5px var(--mono); text-align: left; }
.nlink:hover { text-decoration: underline; }
.partbtn { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px 6px 0; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); font: 12px var(--mono); color: var(--text); }
.tree { list-style: none; padding-left: 0; margin: 6px 0; font-size: 13px; }
.tree ul { list-style: none; padding-left: 14px; margin: 2px 0 2px 5px; border-left: 1px solid var(--line); }
.tree li { margin: 3px 0; }
.tree .row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.tree .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.tree .arg { font: 12px var(--mono); color: var(--muted); }
.tree .v { color: var(--muted); font-variant-numeric: tabular-nums; }
.path { font-size: 12.5px; margin: 4px 0; line-height: 1.7; }
.path .sep { color: var(--faint); margin: 0 4px; }
.tbl { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }

@media (max-width: 1100px) { .app { grid-template-columns: 250px 1fr 330px; } }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 60vh auto auto; height: auto; }
  .seg button { padding: 4px 8px; }
  header { flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
  .search { order: 5; flex-basis: 100%; max-width: none; margin: 0; }
  .brand span { display: none; }
  main { grid-row: 2; } aside.right { grid-row: 3; border-left: 0; border-top: 1px solid var(--line); padding: 16px; } aside.left { grid-row: 4; border-right: 0; border-top: 1px solid var(--line); padding: 16px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Proof chains</b><span id="dataset">—</span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Search ids, titles, equations…" autocomplete="off" aria-label="Search the graph">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Colour by">
      <button data-color="status" aria-pressed="true">Status</button><button data-color="type" aria-pressed="false">Type</button>
    </div>
    <div class="seg" role="group" aria-label="Layout">
      <button data-layout="free" aria-pressed="true" title="Force-directed">Free</button><button data-layout="layered" aria-pressed="false" title="Sources at the bottom, requirements at the top">Layered</button>
    </div>
    <div class="seg" role="group" aria-label="Renderer">
      <button data-mode="3d" aria-pressed="true">3D</button><button data-mode="2d" aria-pressed="false" title="Lighter: canvas 2-D, for low-power laptops">2D</button>
    </div>
    <button class="iconbtn" id="theme" title="Theme: auto / light / dark" aria-label="Theme">◐</button>
  </header>

  <aside class="left">
    <h3>Claims</h3>
    <div class="summary" id="summary"></div>
    <h3>Status <button class="reset" id="resetStatus">all</button></h3>
    <div class="chips" id="statusChips"></div>
    <h3>Type <button class="reset" id="resetType">all</button></h3>
    <div class="chips" id="typeChips"></div>
    <h3>Requirements and claims</h3>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div id="graph"></div>
    <div id="labels"></div>
    <div class="banner" id="banner"></div>
    <div class="legend" id="legend"></div>
    <div class="hint" id="hint">drag to rotate · scroll to zoom · click a node</div>
  </main>

  <aside class="right" id="detail"></aside>
</div>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
